services:
  postgres:
    image: postgres:16
    container_name: text-analyzer-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: text-analyzer-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      TEXT_ANALYZER_SECURITY_USER_USERNAME: ${TEXT_ANALYZER_SECURITY_USER_USERNAME}
      TEXT_ANALYZER_SECURITY_USER_PASSWORD: ${TEXT_ANALYZER_SECURITY_USER_PASSWORD}
      TEXT_ANALYZER_SECURITY_ADMIN_USERNAME: ${TEXT_ANALYZER_SECURITY_ADMIN_USERNAME}
      TEXT_ANALYZER_SECURITY_ADMIN_PASSWORD: ${TEXT_ANALYZER_SECURITY_ADMIN_PASSWORD}
    ports:
      - "${APP_PORT}:8080"
    volumes:
      - ./texts:/app/texts:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: