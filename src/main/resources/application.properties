spring.application.name=text-analyzer

spring.main.banner-mode=off

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/text_analyzer}
spring.datasource.username=${DB_USERNAME:text_user}
spring.datasource.password=${DB_PASSWORD:text_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

logging.level.root=WARN
logging.level.com.example.textanalyzer=INFO

text-analyzer.cli.enabled=false

text-analyzer.security.user.username=${TEXT_ANALYZER_SECURITY_USER_USERNAME:user}
text-analyzer.security.user.password=${TEXT_ANALYZER_SECURITY_USER_PASSWORD:user}

text-analyzer.security.admin.username=${TEXT_ANALYZER_SECURITY_ADMIN_USERNAME:admin}
text-analyzer.security.admin.password=${TEXT_ANALYZER_SECURITY_ADMIN_PASSWORD:admin}